name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core, adapter-contract and UI-lifecycle tests (not real game)
        run: dotnet run --project Tests -c Release
      - name: Packaging regression tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Compile against signature-only RimWorld 1.7 references
        run: dotnet build Source/RaidCheck.csproj -c Release --nologo
      - name: Validate and package self-authored mod
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: RaidCheck-1.0.0-RW1.7
          path: dist/RaidCheck-1.0.0-RW1.7.zip
          if-no-files-found: error

  release-v1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Raid Check v1.0.0')
    needs: test-build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RaidCheck-1.0.0-RW1.7
          path: dist
      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 dist/RaidCheck-1.0.0-RW1.7.zip --target "$GITHUB_SHA" --title "Raid Check v1.0.0" --notes-file docs/releases/v1.0.0.md --latest
